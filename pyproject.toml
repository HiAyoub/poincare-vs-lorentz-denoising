[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hypdenoise"
version = "0.1.0"
description = "Geometry vs architecture in hyperbolic U-Nets for retinal image denoising"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
